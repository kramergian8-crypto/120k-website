<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Spenden-Stand eintragen</title>
<style>
  :root{color-scheme:dark;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
       background:#141414; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#fff;}
  .box{width:100%; max-width:380px; padding:28px; box-sizing:border-box;}
  h1{font-size:20px; margin:0 0 20px;}
  label{display:block; font-size:13px; color:#aaa; margin:16px 0 6px;}
  input{width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1px solid #333;
        background:#1f1f1f; color:#fff; font-size:16px;}
  button{width:100%; margin-top:20px; padding:14px; border:none; border-radius:10px; font-size:16px;
         font-weight:600; cursor:pointer;}
  .btn-add{background:#E4432B; color:#fff;}
  .btn-set{background:#2a2a2a; color:#fff; margin-top:10px;}
  .stand{margin-top:24px; padding:16px; background:#1f1f1f; border-radius:10px; font-size:14px; color:#ccc;}
  .stand b{color:#fff; font-size:22px; display:block; margin-bottom:4px;}
  .msg{margin-top:14px; font-size:13px;}
  .msg.ok{color:#7ee787;}
  .msg.err{color:#ff7b72;}
  .hr{border:none; border-top:1px solid #2a2a2a; margin:24px 0;}
</style>
</head>
<body>
<div class="box">
  <h1>Spenden-Stand eintragen</h1>

  <label for="token">Passwort</label>
  <input id="token" type="password" autocomplete="off" placeholder="Admin-Token" />

  <div class="stand" id="stand">Stand wird geladen…</div>

  <hr class="hr" />

  <label for="amount">Neue Spende hinzufügen (CHF)</label>
  <input id="amount" type="number" min="0" step="1" placeholder="z.B. 50" />
  <button class="btn-add" onclick="hinzufuegen()">Spende hinzufügen</button>

  <hr class="hr" />

  <label for="setTotal">Stand direkt korrigieren (CHF gesamt)</label>
  <input id="setTotal" type="number" min="0" step="1" placeholder="z.B. 1240" />
  <button class="btn-set" onclick="korrigieren()">Stand setzen</button>

  <div id="msg" class="msg"></div>
</div>

<script>
  var API = 'https://120k-donations.kramergian8.workers.dev';

  function getToken() {
    var t = document.getElementById('token').value.trim();
    return t;
  }
  function zeigeStand(d) {
    document.getElementById('stand').innerHTML =
      '<b>' + d.total + ' CHF</b>gesammelt · nächstes Ziel: ' + d.ziel + ' CHF';
  }
  function zeigeMsg(text, ok) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }
  function ladeStand() {
    fetch(API + '/status').then(function(r){ return r.json(); }).then(function(d){
      if (d.fehler) { zeigeMsg('Fehler beim Laden: ' + d.fehler, false); return; }
      zeigeStand(d);
    }).catch(function(e){ zeigeMsg('Fehler beim Laden: ' + e, false); });
  }
  var wirdGesendet = false;
  function setzeButtons(disabled) {
    document.querySelectorAll('button').forEach(function(b){ b.disabled = disabled; });
  }
  function hinzufuegen() {
    if (wirdGesendet) return;
    var token = getToken();
    var amount = document.getElementById('amount').value;
    if (!token) { zeigeMsg('Bitte Passwort eingeben.', false); return; }
    if (!amount || Number(amount) <= 0) { zeigeMsg('Bitte gültigen Betrag eingeben.', false); return; }
    wirdGesendet = true; setzeButtons(true); zeigeMsg('Wird gespeichert…', true);
    fetch(API + '/admin/add?token=' + encodeURIComponent(token) + '&amount=' + encodeURIComponent(amount))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.fehler) { zeigeMsg('Fehler: ' + d.fehler, false); return; }
        zeigeStand(d);
        document.getElementById('amount').value = '';
        zeigeMsg('Gespeichert.', true);
      }).catch(function(e){ zeigeMsg('Fehler: ' + e, false); })
      .finally(function(){ wirdGesendet = false; setzeButtons(false); });
  }
  function korrigieren() {
    if (wirdGesendet) return;
    var token = getToken();
    var total = document.getElementById('setTotal').value;
    if (!token) { zeigeMsg('Bitte Passwort eingeben.', false); return; }
    if (total === '' || Number(total) < 0) { zeigeMsg('Bitte gültigen Betrag eingeben.', false); return; }
    wirdGesendet = true; setzeButtons(true); zeigeMsg('Wird gespeichert…', true);
    fetch(API + '/admin/set?token=' + encodeURIComponent(token) + '&total=' + encodeURIComponent(total))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.fehler) { zeigeMsg('Fehler: ' + d.fehler, false); return; }
        zeigeStand(d);
        document.getElementById('setTotal').value = '';
        zeigeMsg('Gespeichert.', true);
      }).catch(function(e){ zeigeMsg('Fehler: ' + e, false); })
      .finally(function(){ wirdGesendet = false; setzeButtons(false); });
  }
  ladeStand();
</script>
</body>
</html>
